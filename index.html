<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade Batista da Paz - CBP Sede | Site em Manutenção</title>
    <meta name="description" content="O site da Comunidade Batista da Paz (CBP Sede) está em manutenção. Siga nosso Instagram para novidades.">
    <meta property="og:title" content="Comunidade Batista da Paz - CBP Sede">
    <meta property="og:description" content="Site em manutenção. Siga nosso Instagram para novidades.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cbpsede.com.br">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0B1120;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --primary: #0EA5E9;
            --primary-hover: #0284C7;
            --accent: #F59E0B;
            --border-color: rgba(255, 255, 255, 0.08);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at top, #111827 0%, var(--bg-main) 60%);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            max-width: 480px;
            width: 100%;
        }
        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.12);
            border: 1px solid rgba(14, 165, 233, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--primary);
        }
        .logo-title {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: 0.02em;
        }
        .logo-subtitle {
            display: block;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
            margin-bottom: 32px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        h1 {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 12px;
        }
        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-instagram {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #F58529, #DD2A7B, #8134AF, #515BD4);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 28px;
            border-radius: 9999px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(221, 42, 123, 0.5);
        }
        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-icon"><i class="fa-solid fa-dove"></i></div>
        <div class="logo-title">CBP SEDE</div>
        <span class="logo-subtitle">Comunidade Batista da Paz</span>

        <div class="badge"><i class="fa-solid fa-screwdriver-wrench"></i> Site em manutenção</div>

        <h1>Estamos preparando novidades</h1>
        <p>Nosso site está passando por atualizações. Enquanto isso, siga nosso Instagram para ficar por dentro dos cultos, eventos e novidades da CBP Sede.</p>

        <a href="https://www.instagram.com/cbpsede/" target="_blank" rel="noopener" class="btn-instagram">
            <i class="fa-brands fa-instagram"></i> Seguir no Instagram
        </a>

        <footer>Comunidade Batista da Paz &middot; CBP Sede</footer>
    </div>
</body>
</html>
